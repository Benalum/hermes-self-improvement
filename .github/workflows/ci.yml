name: controller-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-controller-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install shell used by syntax checks
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Show tool versions
        run: |
          python --version
          git --version
          bash --version | head -1
          zsh --version

      - name: Verify tracked tree has no generated bytecode
        run: |
          if git ls-files | grep -E '(^|/)__pycache__/|\.py[co]$'; then
            echo 'Generated Python bytecode is tracked in the repository.' >&2
            exit 1
          fi

      - name: Run controller regression suite
        env:
          PYTHON_BIN: python
        run: bash ./scripts/run_synthetic_tests.sh
